# Production overlay. Used together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local development:
#   * client  -> nginx serving the built static site (not the Vite dev server)
#   * minio   -> S3-compatible storage, files kept on the SERVER's own disk
#   * cloudflared -> Cloudflare Tunnel: the only way in from outside. HTTPS is
#                    terminated by Cloudflare; NO host ports are opened, so this
#                    stack cannot clash with other apps on the same server.
#
# Required in the server's /opt/tapcrm/.env (on top of the base file's):
#   NODE_ENV=production
#   CLOUDFLARE_TUNNEL_TOKEN=...        # from the Cloudflare Zero Trust dashboard
#   CLIENT_ORIGIN=https://app.example.com   CORS_ORIGIN=https://app.example.com
#   S3_PUBLIC_ENDPOINT=https://files.example.com
#   MINIO_DATA_DIR=/opt/tapcrm/data/minio   # optional, this is the default
#   UPLOAD_DATA_DIR=/opt/tapcrm/data/uploads # optional, this is the default
#
# Optional, for attendance terminals on the office network (see
# biometric-gateway below):
#   COMPOSE_PROFILES=biometric   BIOMETRIC_BIND=192.168.1.10   BIOMETRIC_PORT=8081
#
# Cloudflare tunnel "Public hostnames" (set in the dashboard):
#   app.example.com   -> http://client:5173
#   files.example.com -> http://minio:9000

services:
  # --- nothing is published on the host; traffic arrives through the tunnel ---
  postgres:
    ports: !reset []
  redis:
    ports: !reset []

  minio:
    build:
      context: docker/minio
    image: tapcrm-minio:local
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      # A plain folder on the server's disk, so it is easy to back up.
      - ${MINIO_DATA_DIR:-/opt/tapcrm/data/minio}:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # FS-6: statutory artifacts (invoices, payslips) go to a write-once bucket.
  minio-init:
    image: tapcrm-minio:local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-tapcrm-files}
      S3_BUCKET_WORM: ${S3_BUCKET_WORM:-tapcrm-worm}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc mb --ignore-existing --with-lock local/$$S3_BUCKET_WORM &&
      mc retention set --default COMPLIANCE 6y local/$$S3_BUCKET_WORM &&
      echo 'buckets ready';
      "
    restart: 'no'

  server:
    restart: unless-stopped
    ports: !reset []
    volumes:
      # Uploaded files (expense receipts, project screenshots, tax exports, and
      # chat files if CHAT_STORAGE_DRIVER=local) on the server's own disk,
      # OUTSIDE the deploy checkout: a checkout clean can never remove them.
      # Same container path as the base file's ./storage mount, so it replaces it.
      - ${UPLOAD_DATA_DIR:-/opt/tapcrm/data/uploads}:/app/storage
    environment:
      # Two proxies in front of the API: cloudflared, then the client nginx. With 1 the
      # API sees every visitor as cloudflared's address, so the per-address sign-in
      # lockout (5 failures) is shared by everyone and one bad day locks the whole
      # company out. 2 reads the real client address Cloudflare puts in the chain.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Signed download links must point at an address browsers can reach.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT in .env (https://files.<your-domain>)}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.prod
    restart: unless-stopped
    ports: !reset []

  # Attendance terminals (ZKTeco / eSSL "ADMS push") on the office network.
  # Off unless enabled. To enable, add to /opt/tapcrm/.env:
  #   COMPOSE_PROFILES=biometric
  #   BIOMETRIC_BIND=<this server's LAN address, e.g. 192.168.1.10>
  # then set each terminal's ADMS / "Cloud server" address to that IP and
  # BIOMETRIC_PORT (default 8081). Only /iclock is forwarded to the API.
  biometric-gateway:
    image: nginx:1.27-alpine
    profiles: ['biometric']
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./docker/biometric-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback unless BIOMETRIC_BIND is set, so turning the profile on never
      # opens a port to the outside by accident.
      - '${BIOMETRIC_BIND:-127.0.0.1}:${BIOMETRIC_PORT:-8081}:8081'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      client:
        condition: service_started
      minio:
        condition: service_healthy

  # Nightly database backup. Writes a compressed pg_dump into a plain folder on
  # the server and keeps the last BACKUP_KEEP_DAYS days. Restore with:
  #   pg_restore -d <db> --clean --if-exists <file>.dump
  backup:
    image: postgres:18.1-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_MIGRATOR_USER:-tapcrm_migrator}
      PGPASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-tapcrm}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-/opt/tapcrm/data/backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/tapcrm-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.partial"; then mv "$$f.partial" "$$f" && echo "backup ok: $$f"; else rm -f "$$f.partial"; echo "backup FAILED"; fi
          find /backups -name 'tapcrm-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
