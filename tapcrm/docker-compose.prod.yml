# Production overlay. Used together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local development:
#   * client  -> nginx serving the built static site (not the Vite dev server)
#   * minio   -> S3-compatible storage, files kept on the SERVER's own disk
#   * cloudflared -> Cloudflare Tunnel: the only way in from outside. HTTPS is
#                    terminated by Cloudflare; NO host ports are opened, so this
#                    stack cannot clash with other apps on the same server.
#
# Required in the server's /opt/tapcrm/.env (on top of the base file's):
#   NODE_ENV=production
#   CLOUDFLARE_TUNNEL_TOKEN=...        # from the Cloudflare Zero Trust dashboard
#   CLIENT_ORIGIN=https://app.example.com   CORS_ORIGIN=https://app.example.com
#   S3_PUBLIC_ENDPOINT=https://files.example.com
#   MINIO_DATA_DIR=/opt/tapcrm/data/minio   # optional, this is the default
#
# Cloudflare tunnel "Public hostnames" (set in the dashboard):
#   app.example.com   -> http://client:5173
#   files.example.com -> http://minio:9000

services:
  # --- nothing is published on the host; traffic arrives through the tunnel ---
  postgres:
    ports: !reset []
  redis:
    ports: !reset []

  minio:
    build:
      context: docker/minio
    image: tapcrm-minio:local
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      # A plain folder on the server's disk, so it is easy to back up.
      - ${MINIO_DATA_DIR:-/opt/tapcrm/data/minio}:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # FS-6: statutory artifacts (invoices, payslips) go to a write-once bucket.
  minio-init:
    image: tapcrm-minio:local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-tapcrm-files}
      S3_BUCKET_WORM: ${S3_BUCKET_WORM:-tapcrm-worm}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc mb --ignore-existing --with-lock local/$$S3_BUCKET_WORM &&
      mc retention set --default COMPLIANCE 6y local/$$S3_BUCKET_WORM &&
      echo 'buckets ready';
      "
    restart: 'no'

  server:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Signed download links must point at an address browsers can reach.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT in .env (https://files.<your-domain>)}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile.prod
    restart: unless-stopped
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      client:
        condition: service_started
      minio:
        condition: service_healthy

  # Nightly database backup. Writes a compressed pg_dump into a plain folder on
  # the server and keeps the last BACKUP_KEEP_DAYS days. Restore with:
  #   pg_restore -d <db> --clean --if-exists <file>.dump
  backup:
    image: postgres:18.1-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_MIGRATOR_USER:-tapcrm_migrator}
      PGPASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-tapcrm}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-/opt/tapcrm/data/backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/tapcrm-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.partial"; then mv "$$f.partial" "$$f" && echo "backup ok: $$f"; else rm -f "$$f.partial"; echo "backup FAILED"; fi
          find /backups -name 'tapcrm-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
