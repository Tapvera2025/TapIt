server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the API's address through Docker's DNS instead of once at startup.
  # nginx caches a name in a plain `proxy_pass http://server:4000` forever, so when
  # only the API container is recreated (a server-only deploy) it gets a new address
  # and this nginx keeps sending to the old one: every /api call returns 502 until
  # nginx is restarted. A variable in proxy_pass makes nginx look the name up again
  # (at most every 10s). It also lets nginx start before the API exists.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SEO content collaboration (Hocuspocus WebSocket) -> its own port on the
  # server container. Same origin as the app, so it works through the tunnel.
  location = /api/collab {
    set $collab_upstream http://server:4001;
    proxy_pass $collab_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # API + WebSocket (chat/realtime) -> the server container. This replaces the
  # Vite dev proxy used locally.
  location /api/ {
    set $api_upstream http://server:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }

  # Attendance terminals push to /iclock/*, but not through this public site:
  # they use the office-network gateway (docker/biometric-gateway). Answer 404
  # so a terminal pointed here shows an error and keeps its punches, instead of
  # receiving the app's index.html with 200 and discarding them as delivered.
  location /iclock {
    return 404;
  }

  # Public pages are plain HTML files: /privacy serves privacy.html, and so on.
  # Every other unknown path falls back to the single-page app's index.html.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
