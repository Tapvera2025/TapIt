server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  # API + WebSocket (chat/realtime) -> the server container. This replaces the
  # Vite dev proxy used locally.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }

  # Public pages are plain HTML files: /privacy serves privacy.html, and so on.
  # Every other unknown path falls back to the single-page app's index.html.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
