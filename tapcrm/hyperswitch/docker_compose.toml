application_source = "main"

[server]
port = 8080
host = "0.0.0.0"

[log.file]
enabled = false

[log.console]
enabled = true
level = "INFO"

[master_database]
username = "db_user"
password = "db_pass"
host = "hyperswitch-postgres"
port = 5432
dbname = "hyperswitch_db"
max_pool_size = 5
min_idle_pool_size = 1

[replica_database]
username = "db_user"
password = "db_pass"
host = "hyperswitch-postgres"
port = 5432
dbname = "hyperswitch_db"
max_pool_size = 5
min_idle_pool_size = 1

[accounts_database]
username = "db_user"
password = "db_pass"
host = "hyperswitch-postgres"
port = 5432
dbname = "hyperswitch_db"
max_pool_size = 5
min_idle_pool_size = 1

[global_database]
username = "db_user"
password = "db_pass"
host = "hyperswitch-postgres"
port = 5432
dbname = "hyperswitch_db"
max_pool_size = 5
min_idle_pool_size = 1

[secrets]
admin_api_key = "test_admin_api_key_hyperswitch"
jwt_secret = "tapcrm-local-jwt-secret"
master_enc_key = "73ad7bbbbc640c845a150f67d058b279849370cd2c1f3c67c4dd6c869213e13a"

[redis]
host = "hyperswitch-redis"
port = 6379
cluster_enabled = false
redis_lock_expiry_seconds = 100

[forex_api]
api_key = ""
fallback_api_key = ""
data_expiration_delay_in_seconds = 21600
redis_lock_timeout_in_seconds = 100
redis_lock_expiry_seconds = 100
redis_ttl_in_seconds = 172800

[locker]
mock_locker = true
locker_enabled = true
plain_fingerprint_response = true

[lock_settings]
redis_lock_expiry_seconds = 180
delay_between_retries_in_milliseconds = 500

[webhooks]
outgoing_enabled = true
redis_lock_expiry_seconds = 180

[cors]
max_age = 30
wildcard_origin = true
allowed_methods = "GET,POST,PUT,DELETE"

[api_keys]
hash_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[superposition]
endpoint = "http://hyperswitch-superposition:8080"
token = "123456"
org_id = "localorg"
workspace_id = "dev"
polling_interval_milliseconds = 15000
backup_file_path = "/local/config/superposition_seed.toml"

