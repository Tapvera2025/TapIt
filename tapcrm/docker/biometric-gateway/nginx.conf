# Biometric gateway: the office network's way in for attendance terminals.
#
# ZKTeco / eSSL (ADMS "push") terminals send punches as plain HTTP to /iclock/*
# (attendance design §10.5, modules/biometric/machine-router.ts). They cannot
# use the Cloudflare tunnel, and the public site deliberately does not carry
# /iclock. This listener is published on the office server's LAN address only
# (BIOMETRIC_BIND, docker-compose.prod.yml) and forwards nothing but /iclock.
server {
  listen 8081;
  server_tokens off;

  # Re-resolve the API's address through Docker's DNS instead of once at startup.
  # nginx caches a name in a plain `proxy_pass http://server:4000` forever, so when
  # only the API container is recreated (a server-only deploy) it gets a new address
  # and this nginx keeps sending to the old one: every /api call returns 502 until
  # nginx is restarted. A variable in proxy_pass makes nginx look the name up again
  # (at most every 10s). It also lets nginx start before the API exists.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /iclock {
    set $api_upstream http://server:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The terminal's own address as nginx saw it, replacing anything the caller
    # sent. The server reads it as req.ip (trust proxy 1) for the per-device IP
    # allowlist and the per-address rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # The API accepts up to 5 MB per push (machine-router.ts).
    client_max_body_size 6m;
    proxy_read_timeout 60s;
  }

  # The rest of the API is not reachable from the office network this way.
  location / {
    return 404;
  }
}
